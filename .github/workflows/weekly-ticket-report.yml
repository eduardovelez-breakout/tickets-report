name: Weekly Ticket Report

on:
  schedule:
    # Fridays at 9:00 AM America/Chicago (14:00 UTC during CST; adjust if needed)
    - cron: '0 14 * * 5'
  workflow_dispatch:
    inputs:
      start_date:
        description: "Optional start date (UTC), e.g. 2026-05-01 or 2026-05-01T00:00:00Z"
        required: false
        default: ""
      end_date:
        description: "Optional end date (UTC), e.g. 2026-05-08 or 2026-05-08T00:00:00Z"
        required: false
        default: ""

jobs:
  export-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write Google service account key
        run: |
          cat > google_service_account.json <<'EOF'
          ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          EOF

      - name: Export weekly tickets CSV (scheduled)
        if: github.event_name != 'workflow_dispatch'
        env:
          HUBSPOT_PAT: ${{ secrets.HUBSPOT_PAT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python export_weekly_tickets.py \
            --token "$HUBSPOT_PAT" \
            --gemini-api-key "$GEMINI_API_KEY" \
            --workers 10

      - name: Export weekly tickets CSV (manual with Gemini logs)
        if: github.event_name == 'workflow_dispatch'
        env:
          HUBSPOT_PAT: ${{ secrets.HUBSPOT_PAT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          START_DATE: ${{ github.event.inputs.start_date }}
          END_DATE: ${{ github.event.inputs.end_date }}
        run: |
          DATE_ARGS=""
          if [ -n "$START_DATE" ]; then
            DATE_ARGS="$DATE_ARGS --start-date $START_DATE"
          fi
          if [ -n "$END_DATE" ]; then
            DATE_ARGS="$DATE_ARGS --end-date $END_DATE"
          fi
          python export_weekly_tickets.py \
            --token "$HUBSPOT_PAT" \
            --gemini-api-key "$GEMINI_API_KEY" \
            --workers 10 \
            --log-gemini \
            --log-gemini-payload-preview \
            --log-gemini-payload-chars 250 \
            $DATE_ARGS

      - name: Retry pending Gemini summaries (delayed)
        env:
          HUBSPOT_PAT: ${{ secrets.HUBSPOT_PAT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          START_DATE: ${{ github.event.inputs.start_date }}
          END_DATE: ${{ github.event.inputs.end_date }}
        run: |
          PENDING_FILE="report_artifacts/pending_summary_retries.csv"
          if [ ! -f "$PENDING_FILE" ]; then
            echo "No pending retry file found; skipping retry pass."
            exit 0
          fi

          # Header-only file means no pending rows.
          PENDING_LINES=$(wc -l < "$PENDING_FILE")
          if [ "$PENDING_LINES" -le 1 ]; then
            echo "No pending summary retries; skipping retry pass."
            exit 0
          fi

          echo "Pending retries detected ($((PENDING_LINES-1)) rows). Waiting 600s before retry pass."
          sleep 600

          DATE_ARGS=""
          if [ -n "$START_DATE" ]; then
            DATE_ARGS="$DATE_ARGS --start-date $START_DATE"
          fi
          if [ -n "$END_DATE" ]; then
            DATE_ARGS="$DATE_ARGS --end-date $END_DATE"
          fi

          python export_weekly_tickets.py \
            --token "$HUBSPOT_PAT" \
            --gemini-api-key "$GEMINI_API_KEY" \
            --workers 10 \
            --retry-pending-only \
            --log-gemini \
            --log-gemini-payload-preview \
            --log-gemini-payload-chars 250 \
            $DATE_ARGS

      - name: Generate weekly markdown report
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python generate_high_level_report.py \
            --api-key "$GEMINI_API_KEY" \
            --gemini-max-per-minute 20

      - name: Upload markdown report to Google Docs
        id: upload_report_doc
        run: |
          DOC_URL=$(python upload_md_to_google_docs.py \
            --file "report_artifacts/final_report.md" \
            --csv-path "Tickets - Last 7 Days.csv" \
            --credentials google_service_account.json \
            --title-prefix "Weekly Ticket Report" \
            --folder-id "16wZaESG4V0f2q7Vp9eLl8AXXIH26tDzh" \
            --folder-name "Weekly Ticket Reports" \
            --share-domain "breakoutlearning.com" \
            --share-role "writer" \
            --allow-missing-doc-link \
            --fallback-save-dir "report_artifacts/pending_drive_uploads")
          echo "doc_url=$DOC_URL" >> "$GITHUB_OUTPUT"

      - name: Upload fallback markdown artifact (if Drive failed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pending-drive-upload
          path: report_artifacts/pending_drive_uploads/*.md
          if-no-files-found: ignore

      - name: Upload CSV to Google Sheets
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          REPORT_DOC_URL: ${{ steps.upload_report_doc.outputs.doc_url }}
        run: |
          python upload_to_google_sheets.py \
            --sheet-id "$GOOGLE_SHEET_ID" \
            --csv-path "Tickets - Last 7 Days.csv" \
            --credentials google_service_account.json \
            --tab-prefix "Weekly Tickets" \
            --top-link "$REPORT_DOC_URL" \
            --top-link-label "Weekly Ticket Report"
