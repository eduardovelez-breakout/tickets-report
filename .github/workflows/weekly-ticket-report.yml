name: Weekly Ticket Report

on:
  schedule:
    # Fridays at 9:00 AM America/Chicago (14:00 UTC during CST; adjust if needed)
    - cron: '0 14 * * 5'
  workflow_dispatch:

jobs:
  export-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write Google service account key
        run: |
          cat > google_service_account.json <<'EOF'
          ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          EOF

      - name: Export weekly tickets CSV (scheduled)
        if: github.event_name != 'workflow_dispatch'
        env:
          HUBSPOT_PAT: ${{ secrets.HUBSPOT_PAT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python export_weekly_tickets.py \
            --token "$HUBSPOT_PAT" \
            --gemini-api-key "$GEMINI_API_KEY" \
            --workers 10

      - name: Export weekly tickets CSV (manual with Gemini logs)
        if: github.event_name == 'workflow_dispatch'
        env:
          HUBSPOT_PAT: ${{ secrets.HUBSPOT_PAT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python export_weekly_tickets.py \
            --token "$HUBSPOT_PAT" \
            --gemini-api-key "$GEMINI_API_KEY" \
            --workers 10 \
            --log-gemini \
            --log-gemini-payload-preview \
            --log-gemini-payload-chars 250

      - name: Generate weekly markdown report
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python generate_high_level_report.py \
            --api-key "$GEMINI_API_KEY" \
            --gemini-max-per-minute 20

      - name: Upload markdown report to Google Docs
        id: upload_report_doc
        run: |
          DOC_URL=$(python upload_md_to_google_docs.py \
            --file "report_artifacts/final_report.md" \
            --csv-path "Tickets - Last 7 Days.csv" \
            --credentials google_service_account.json \
            --title-prefix "Weekly Ticket Report" \
            --folder-name "Weekly Ticket Reports" \
            --share-domain "breakoutlearning.com" \
            --share-role "writer" \
            --allow-missing-doc-link \
            --fallback-save-dir "report_artifacts/pending_drive_uploads")
          echo "doc_url=$DOC_URL" >> "$GITHUB_OUTPUT"

      - name: Upload fallback markdown artifact (if Drive failed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pending-drive-upload
          path: report_artifacts/pending_drive_uploads/*.md
          if-no-files-found: ignore

      - name: Upload CSV to Google Sheets
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          REPORT_DOC_URL: ${{ steps.upload_report_doc.outputs.doc_url }}
        run: |
          python upload_to_google_sheets.py \
            --sheet-id "$GOOGLE_SHEET_ID" \
            --csv-path "Tickets - Last 7 Days.csv" \
            --credentials google_service_account.json \
            --tab-prefix "Weekly Tickets" \
            --top-link "$REPORT_DOC_URL" \
            --top-link-label "Weekly Ticket Report"
